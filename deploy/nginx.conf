# ============================================================
# 应急决策教学系统 - Nginx配置
# 部署时复制到 /etc/nginx/sites-available/emergency-decision
# 然后 ln -s /etc/nginx/sites-available/emergency-decision /etc/nginx/sites-enabled/
# ============================================================

# 上游Flask应用（Gunicorn）
upstream emergency_app {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    # 如果有域名，替换下面的 your-domain.com
    # server_name your-domain.com;
    server_name _;

    # 如果有域名且需要HTTPS，取消下面注释（需先安装证书）
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 客户端上传大小限制（场景JSON可能较大）
    client_max_body_size 20M;

    # 静态文件直接由Nginx处理（更快）
    location /static/ {
        alias /opt/emergency-decision/src/emergency_decision/web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其他请求转发给Flask
    location / {
        proxy_pass http://emergency_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # WebSocket支持（如果未来需要）
    location /ws {
        proxy_pass http://emergency_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
