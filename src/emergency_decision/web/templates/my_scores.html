{% extends "base.html" %}
{% block title %}评 · 我的成绩 - 应急决策教学系统{% endblock %}

{% block content %}
<div style="margin-bottom:20px;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
    <div style="width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg, #ef4444, #dc2626); display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; font-weight:800;">评</div>
    <div>
      <h2 style="font-size:22px; font-weight:700; margin:0;">我的成绩</h2>
      <p style="font-size:13px; color:#64748b; margin:0;">查看历次决策评分与成长记录</p>
    </div>
  </div>
</div>

<!-- ====== 成绩概览 ====== -->
<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:24px;">
  <div class="card" style="padding:20px; margin:0;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:44px; height:44px; border-radius:10px; background:#fef2f2; display:flex; align-items:center; justify-content:center; font-size:22px;">📝</div>
      <div>
        <div style="font-size:26px; font-weight:700; color:#dc2626;" id="stat-total">0</div>
        <div style="font-size:12px; color:#64748b;">完成决策次数</div>
      </div>
    </div>
  </div>
  <div class="card" style="padding:20px; margin:0;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:44px; height:44px; border-radius:10px; background:#fefce8; display:flex; align-items:center; justify-content:center; font-size:22px;">⭐</div>
      <div>
        <div style="font-size:26px; font-weight:700; color:#a16207;" id="stat-avg">0</div>
        <div style="font-size:12px; color:#64748b;">平均分</div>
      </div>
    </div>
  </div>
  <div class="card" style="padding:20px; margin:0;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:44px; height:44px; border-radius:10px; background:#ecfdf5; display:flex; align-items:center; justify-content:center; font-size:22px;">🏆</div>
      <div>
        <div style="font-size:26px; font-weight:700; color:#15803d;" id="stat-best">0</div>
        <div style="font-size:12px; color:#64748b;">最高分</div>
      </div>
    </div>
  </div>
</div>

<!-- ====== 成绩列表 ====== -->
<div class="card">
  <div class="card-header">
    <h3>📋 历次成绩记录</h3>
    <span style="font-size:12px; color:#94a3b8;" id="score-count">0 次记录</span>
  </div>
  <div id="score-list" style="min-height:200px;">
    <div style="text-align:center; padding:40px; color:#94a3b8;">
      <div style="font-size:28px; margin-bottom:8px;">📊</div>
      <div style="font-size:13px;">正在加载成绩...</div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const _studentId = '{{ current_user.username if current_user else "" }}';

async function loadMyScores() {
  if (!_studentId) return;
  try {
    const data = await API.get('/api/my-scores/' + _studentId);
    const scores = data.scores || [];
    
    document.getElementById('stat-total').textContent = data.total_sessions || 0;
    document.getElementById('stat-avg').textContent = data.avg_score || 0;
    document.getElementById('score-count').textContent = (data.total_sessions || 0) + ' 次记录';
    
    const bestScore = scores.length > 0 ? Math.max(...scores.map(s => s.score || 0)) : 0;
    document.getElementById('stat-best').textContent = bestScore;

    const el = document.getElementById('score-list');
    if (scores.length === 0) {
      el.innerHTML = `
        <div style="text-align:center; padding:60px 20px;">
          <div style="font-size:48px; margin-bottom:16px;">📭</div>
          <div style="font-size:16px; font-weight:600; color:#475569; margin-bottom:8px;">暂无成绩记录</div>
          <div style="font-size:13px; color:#94a3b8; margin-bottom:20px;">完成你的第一次应急决策来获得成绩</div>
          <a href="/decision" style="display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:10px; background:#4f46e5; color:#fff; font-size:14px; font-weight:600; text-decoration:none;">
            <span>⚡</span> 前往实战决策
          </a>
        </div>`;
      return;
    }

    el.innerHTML = scores.slice().reverse().map((s, idx) => {
      const [grade, gradeDesc] = getGrade(s.score || 0);
      const gradeColors = { S:'#8b5cf6', A:'#10b981', B:'#3b82f6', C:'#f59e0b', D:'#ef4444' };
      const gc = gradeColors[grade] || '#64748b';
      
      // 维度得分
      const dims = s.dimensions || {};
      const dimKeys = Object.keys(dims);
      const dimBars = dimKeys.map(k => {
        const v = dims[k];
        const score = typeof v === 'object' ? (v.score || 0) : (v || 0);
        const label = typeof v === 'object' ? (v.label || k) : k;
        return `
          <div style="margin-bottom:6px;">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:#64748b; margin-bottom:2px;">
              <span>${label}</span><span style="font-weight:600; color:#1e293b;">${score}分</span>
            </div>
            <div style="height:6px; background:#f1f5f9; border-radius:3px; overflow:hidden;">
              <div style="height:100%; width:${score}%; background:${gc}; border-radius:3px; transition:width 0.5s;"></div>
            </div>
          </div>`;
      }).join('');

      return `
        <div style="padding:20px; border-bottom:1px solid #f1f5f9;">
          <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:16px;">
            <div style="display:flex; align-items:center; gap:16px;">
              <div style="width:52px; height:52px; border-radius:14px; background:${gc}15; border:2px solid ${gc}; display:flex; align-items:center; justify-content:center;">
                <div style="text-align:center;">
                  <div style="font-size:22px; font-weight:800; color:${gc}; line-height:1;">${grade}</div>
                </div>
              </div>
              <div>
                <div style="font-size:16px; font-weight:700; color:#1e293b;">第 ${scores.length - idx} 次决策</div>
                <div style="font-size:12px; color:#94a3b8; margin-top:2px;">
                  ${s.scenario_id || '通用场景'} · ${s.created_at || '未知时间'}
                </div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:28px; font-weight:800; color:${gc};">${s.score || 0}</div>
              <div style="font-size:11px; color:#94a3b8;">${gradeDesc}</div>
            </div>
          </div>
          ${dimBars ? `<div style="padding:12px 16px; background:#f8fafc; border-radius:10px; margin-bottom:8px;">
            <div style="font-size:12px; font-weight:600; color:#475569; margin-bottom:8px;">📊 维度评分</div>
            ${dimBars}
          </div>` : ''}
        </div>`;
    }).join('');
  } catch (e) {
    console.error(e);
    document.getElementById('score-list').innerHTML = '<div style="text-align:center; padding:40px; color:#ef4444;">加载失败: ' + e.message + '</div>';
  }
}

loadMyScores();
</script>
{% endblock %}
