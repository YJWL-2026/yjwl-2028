{% extends "base.html" %}
{% block title %}灾害查询 - 实时灾害数据{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom: 20px;">
  <h2>🌐 灾害查询 — 实时灾害数据</h2>
  <p class="text-muted">接入中国地震台网、中央气象台台风网、国家气象预警信息，支持查看实时灾情并导入为教学场景</p>
</div>

<!-- Tab切换 -->
<div class="tab-bar" style="display:flex; gap:8px; margin-bottom:20px; border-bottom:2px solid #e0e0e0;">
  <button class="tab-btn active" onclick="switchTab('earthquake')" data-tab="earthquake"
    style="padding:12px 24px; border:none; background:none; cursor:pointer; font-size:15px; font-weight:600; border-bottom:3px solid #3b82f6; color:#3b82f6;">
    🌍 地震查询
  </button>
  <button class="tab-btn" onclick="switchTab('typhoon')" data-tab="typhoon"
    style="padding:12px 24px; border:none; background:none; cursor:pointer; font-size:15px; font-weight:600; border-bottom:3px solid transparent; color:#666;">
    🌀 台风查询
  </button>
  <button class="tab-btn" onclick="switchTab('alert')" data-tab="alert"
    style="padding:12px 24px; border:none; background:none; cursor:pointer; font-size:15px; font-weight:600; border-bottom:3px solid transparent; color:#666;">
    ⚠️ 天气预警
  </button>
</div>

<!-- ========== 地震查询 ========== -->
<div id="tab-earthquake" class="tab-content">
  <div style="display:flex; gap:12px; margin-bottom:16px; align-items:center;">
    <label style="font-size:14px;">最小震级:</label>
    <select id="eq-min-mag" style="padding:6px 12px; border:1px solid #ccc; border-radius:6px;">
      <option value="0">全部</option>
      <option value="3">3.0+</option>
      <option value="4">4.0+</option>
      <option value="5" selected>5.0+</option>
      <option value="6">6.0+</option>
      <option value="7">7.0+</option>
    </select>
    <button class="btn btn-primary" onclick="loadEarthquakes()">🔍 查询最新地震</button>
    <span class="text-muted text-sm" id="eq-source-info"></span>
  </div>

  <div style="display:flex; gap:20px;">
    <!-- 地图 -->
    <div style="flex:1;">
      <div id="eq-map" style="height:500px; border-radius:12px; border:1px solid #e0e0e0; box-shadow:0 2px 8px rgba(0,0,0,0.06);"></div>
    </div>
    <!-- 列表 -->
    <div style="width:480px;">
      <div style="background:#fff; border-radius:12px; border:1px solid #e0e0e0; box-shadow:0 2px 8px rgba(0,0,0,0.06); height:500px; display:flex; flex-direction:column;">
        <div style="padding:12px 16px; border-bottom:1px solid #e0e0e0; font-weight:700; display:flex; justify-content:space-between; align-items:center;">
          <span>📡 最新地震列表</span>
          <span class="text-muted text-sm" id="eq-count"></span>
        </div>
        <div id="eq-list" style="flex:1; overflow-y:auto; padding:8px;">
          <div class="text-center text-muted" style="padding:40px;">点击"查询最新地震"获取数据</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 地震详情 -->
  <div id="eq-detail" style="display:none; margin-top:20px;">
    <div class="card" style="padding:20px;">
      <h3 id="eq-detail-title"></h3>
      <div id="eq-detail-content"></div>
      <button class="btn btn-success" onclick="importEarthquake()" id="eq-import-btn" style="margin-top:16px;">
        📝 一键添加至场景
      </button>
    </div>
  </div>
</div>

<!-- ========== 台风查询 ========== -->
<div id="tab-typhoon" class="tab-content" style="display:none;">
  <div style="display:flex; gap:12px; margin-bottom:16px; align-items:center;">
    <label style="font-size:14px;">年份:</label>
    <select id="ty-year" style="padding:6px 12px; border:1px solid #ccc; border-radius:6px;">
      <option value="" selected>全部</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
    </select>
    <button class="btn btn-primary" onclick="loadTyphoons()">🔍 查询台风列表</button>
    <span class="text-muted text-sm" id="ty-source-info"></span>
  </div>

  <div style="display:flex; gap:20px;">
    <!-- 地图 -->
    <div style="flex:1;">
      <div id="ty-map" style="height:500px; border-radius:12px; border:1px solid #e0e0e0; box-shadow:0 2px 8px rgba(0,0,0,0.06);"></div>
    </div>
    <!-- 列表 -->
    <div style="width:400px;">
      <div style="background:#fff; border-radius:12px; border:1px solid #e0e0e0; height:500px; display:flex; flex-direction:column;">
        <div style="padding:12px 16px; border-bottom:1px solid #e0e0e0; font-weight:700;">
          🌀 台风列表 <span class="text-muted text-sm" id="ty-count"></span>
        </div>
        <div id="ty-list" style="flex:1; overflow-y:auto; padding:8px;">
          <div class="text-center text-muted" style="padding:40px;">点击"查询台风列表"获取数据</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 台风详情 -->
  <div id="ty-detail" style="display:none; margin-top:20px;">
    <div class="card" style="padding:20px;">
      <h3 id="ty-detail-title"></h3>
      <div id="ty-detail-content"></div>
      <button class="btn btn-success" onclick="importTyphoon()" id="ty-import-btn" style="margin-top:16px; display:none;">
        📝 一键添加至场景
      </button>
    </div>
  </div>
</div>

<!-- ========== 天气预警 ========== -->
<div id="tab-alert" class="tab-content" style="display:none;">
  <div style="display:flex; gap:12px; margin-bottom:16px; align-items:center; flex-wrap:wrap;">
    <label style="font-size:14px;">预警类型:</label>
    <select id="alert-type" style="padding:6px 12px; border:1px solid #ccc; border-radius:6px;">
      <option value="">全部</option>
      <option value="暴雨">暴雨</option>
      <option value="洪水">洪水</option>
      <option value="地质灾害">地质灾害(滑坡/泥石流)</option>
      <option value="山洪">山洪</option>
      <option value="台风">台风</option>
      <option value="大风">大风</option>
      <option value="雷电">雷电</option>
      <option value="高温">高温</option>
    </select>
    <button class="btn btn-primary" onclick="loadAlerts()">🔍 查询预警信息</button>
    <span class="text-muted text-sm" id="alert-source-info"></span>
  </div>

  <div style="display:flex; gap:20px;">
    <!-- 地图 -->
    <div style="flex:1;">
      <div id="alert-map" style="height:500px; border-radius:12px; border:1px solid #e0e0e0; box-shadow:0 2px 8px rgba(0,0,0,0.06);"></div>
    </div>
    <!-- 列表 -->
    <div style="width:480px;">
      <div style="background:#fff; border-radius:12px; border:1px solid #e0e0e0; height:500px; display:flex; flex-direction:column;">
        <div style="padding:12px 16px; border-bottom:1px solid #e0e0e0; font-weight:700;">
          ⚠️ 预警信息列表 <span class="text-muted text-sm" id="alert-count"></span>
        </div>
        <div id="alert-list" style="flex:1; overflow-y:auto; padding:8px;">
          <div class="text-center text-muted" style="padding:40px;">点击"查询预警信息"获取数据</div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
// ===== 全局状态 =====
let eqMap = null, tyMap = null, alertMap = null;
let eqMarkers = [], tyTrackLayer = null, alertMarkers = [];
let currentEarthquake = null;
let typhoonList = [];

// ===== Tab切换 =====
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = '';
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.style.borderBottomColor = 'transparent';
    btn.style.color = '#666';
  });
  const activeBtn = document.querySelector(`[data-tab="${tab}"]`);
  activeBtn.style.borderBottomColor = '#3b82f6';
  activeBtn.style.color = '#3b82f6';

  // 初始化对应地图
  setTimeout(() => {
    if (tab === 'earthquake' && eqMap) eqMap.invalidateSize();
    if (tab === 'typhoon' && tyMap) tyMap.invalidateSize();
    if (tab === 'alert' && alertMap) alertMap.invalidateSize();
  }, 100);
}

// ===== 地图初始化 =====
function initEqMap() {
  if (eqMap) return;
  eqMap = L.map('eq-map').setView([35, 105], 4);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1', '2', '3', '4'], attribution: '高德地图', maxZoom: 18
  }).addTo(eqMap);
}

function initTyMap() {
  if (tyMap) return;
  tyMap = L.map('ty-map').setView([25, 130], 4);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1', '2', '3', '4'], attribution: '高德地图', maxZoom: 18
  }).addTo(tyMap);
}

function initAlertMap() {
  if (alertMap) return;
  alertMap = L.map('alert-map').setView([35, 105], 4);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1', '2', '3', '4'], attribution: '高德地图', maxZoom: 18
  }).addTo(alertMap);
}

// ===== 震级颜色 =====
function eqColor(mag) {
  if (mag >= 7) return '#dc2626';
  if (mag >= 6) return '#ea580c';
  if (mag >= 5) return '#f59e0b';
  if (mag >= 4) return '#3b82f6';
  return '#10b981';
}
function eqRadius(mag) {
  return Math.max(6, mag * 4);
}

// ===== 地震查询 =====
async function loadEarthquakes() {
  const minMag = document.getElementById('eq-min-mag').value;
  try {
    showToast('正在获取地震数据...');
    const data = await API.get('/api/realtime/earthquakes?min_magnitude=' + minMag + '&limit=50');
    const earthquakes = data.earthquakes || [];
    document.getElementById('eq-source-info').textContent = data.source || '';
    document.getElementById('eq-count').textContent = `共${earthquakes.length}条`;

    initEqMap();
    setTimeout(() => eqMap.invalidateSize(), 100);

    // 清除旧标记
    eqMarkers.forEach(m => eqMap.removeLayer(m));
    eqMarkers = [];

    // 渲染列表
    const listEl = document.getElementById('eq-list');
    if (earthquakes.length === 0) {
      listEl.innerHTML = '<div class="text-center text-muted" style="padding:40px;">暂无地震数据</div>';
      return;
    }
    listEl.innerHTML = earthquakes.map((eq, i) => {
      const color = eqColor(eq.magnitude);
      return `<div class="eq-item" onclick="selectEarthquake(${i})" data-idx="${i}"
        style="padding:10px 12px; margin-bottom:6px; border-radius:8px; cursor:pointer; border:1px solid #eee; transition:background 0.2s;"
        onmouseover="this.style.background='#f0f7ff'" onmouseout="this.style.background=''">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="display:inline-block; width:28px; height:28px; border-radius:50%; background:${color}; color:#fff; text-align:center; line-height:28px; font-weight:700; font-size:12px;">
            ${eq.magnitude.toFixed(1)}
          </span>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:13px;">${eq.location}</div>
            <div class="text-muted text-sm">${eq.time} | 深度${eq.depth}km | 烈度${eq.intensity}度</div>
          </div>
          <span class="tag ${eq.eq_type === 'reviewed' ? 'tag-green' : 'tag-orange'}" style="font-size:11px;">
            ${eq.eq_type === 'reviewed' ? '正式' : '速报'}
          </span>
        </div>
      </div>`;
    }).join('');

    // 渲染地图标记
    earthquakes.forEach(eq => {
      if (eq.latitude && eq.longitude) {
        const marker = L.circleMarker([eq.latitude, eq.longitude], {
          radius: eqRadius(eq.magnitude),
          fillColor: eqColor(eq.magnitude),
          color: '#fff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.7
        }).addTo(eqMap);
        marker.bindPopup(`<b>${eq.location}</b><br>震级: M${eq.magnitude}<br>时间: ${eq.time}<br>深度: ${eq.depth}km<br>烈度: ${eq.intensity}度`);
        eqMarkers.push(marker);
      }
    });

    // 适配视图
    if (eqMarkers.length > 0) {
      const group = L.featureGroup(eqMarkers);
      eqMap.fitBounds(group.getBounds().pad(0.1));
    }

    // 存储数据
    window._earthquakes = earthquakes;
    showToast(`获取到${earthquakes.length}条地震数据`);
  } catch (e) {
    handleError(e, '地震查询');
  }
}

function selectEarthquake(idx) {
  const eq = window._earthquakes[idx];
  currentEarthquake = eq;
  // 高亮列表项
  document.querySelectorAll('.eq-item').forEach(el => el.style.borderColor = '#eee');
  const item = document.querySelector(`[data-idx="${idx}"]`);
  if (item) item.style.borderColor = '#3b82f6';

  // 显示详情
  document.getElementById('eq-detail').style.display = '';
  document.getElementById('eq-detail-title').textContent = `📊 ${eq.location} M${eq.magnitude}`;
  const color = eqColor(eq.magnitude);
  document.getElementById('eq-detail-content').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin:16px 0;">
      <div style="text-align:center; padding:16px; background:#f9fafb; border-radius:8px;">
        <div class="text-muted text-sm">震级</div>
        <div style="font-size:28px; font-weight:700; color:${color};">M${eq.magnitude}</div>
      </div>
      <div style="text-align:center; padding:16px; background:#f9fafb; border-radius:8px;">
        <div class="text-muted text-sm">震源深度</div>
        <div style="font-size:28px; font-weight:700;">${eq.depth}<span style="font-size:14px;">km</span></div>
      </div>
      <div style="text-align:center; padding:16px; background:#f9fafb; border-radius:8px;">
        <div class="text-muted text-sm">烈度</div>
        <div style="font-size:28px; font-weight:700;">${eq.intensity}<span style="font-size:14px;">度</span></div>
      </div>
    </div>
    <table class="data-table" style="width:100%;">
      <tr><td style="width:120px;" class="text-muted">发震时间</td><td>${eq.time}</td></tr>
      <tr><td class="text-muted">报告时间</td><td>${eq.report_time || '-'}</td></tr>
      <tr><td class="text-muted">震中位置</td><td>${eq.location}</td></tr>
      <tr><td class="text-muted">经纬度</td><td>北纬${eq.latitude}° 东经${eq.longitude}°</td></tr>
      <tr><td class="text-muted">数据类型</td><td>${eq.eq_type === 'reviewed' ? '正式测定' : '自动速报'}</td></tr>
      <tr><td class="text-muted">事件编号</td><td style="font-family:monospace; font-size:12px;">${eq.event_id}</td></tr>
    </table>
  `;

  // 飞到地震位置
  if (eqMap) {
    eqMap.flyTo([eq.latitude, eq.longitude], 7, {duration: 1});
  }
}

async function importEarthquake() {
  if (!currentEarthquake) return;
  if (!confirm(`确定将地震「${currentEarthquake.location} M${currentEarthquake.magnitude}」一键添加为教学场景？\n\n系统将根据地震参数自动生成物流网络、车辆、仓库、货物等场景数据。`)) return;

  try {
    showToast('正在生成场景...');
    const result = await API.post('/api/realtime/import-earthquake', {
      event_id: currentEarthquake.event_id
    });
    showToast(`导入成功: ${result.scenario_name}`);
    // 显示成功信息
    document.getElementById('eq-detail-content').innerHTML += `
      <div class="card" style="margin-top:16px; padding:16px; background:#f0fdf4; border-color:#86efac;">
        <div style="font-weight:700; color:#15803d;">✅ 场景导入成功</div>
        <div style="margin-top:8px;">场景ID: <code>${result.scenario_id}</code></div>
        <div>场景名称: ${result.scenario_name}</div>
        <div style="margin-top:8px;">
          <a href="/decision?scenario=${result.scenario_id}" class="btn btn-success btn-sm">进入决策</a>
          <a href="/editor?scenario=${result.scenario_id}" class="btn btn-outline btn-sm">编辑场景</a>
        </div>
      </div>
    `;
    document.getElementById('eq-import-btn').style.display = 'none';
  } catch (e) {
    handleError(e, '导入地震');
  }
}

// ===== 台风查询 =====
async function loadTyphoons() {
  const year = document.getElementById('ty-year').value;
  try {
    showToast('正在获取台风数据...');
    const url = '/api/realtime/typhoons' + (year ? '?year=' + year : '');
    const data = await API.get(url);
    typhoonList = data.typhoons || [];
    document.getElementById('ty-source-info').textContent = data.source || '';
    document.getElementById('ty-count').textContent = `共${typhoonList.length}个`;

    initTyMap();
    setTimeout(() => tyMap.invalidateSize(), 100);

    // 清除旧轨迹
    if (tyTrackLayer) { tyMap.removeLayer(tyTrackLayer); tyTrackLayer = null; }

    // 渲染列表
    const listEl = document.getElementById('ty-list');
    if (typhoonList.length === 0) {
      listEl.innerHTML = '<div class="text-center text-muted" style="padding:40px;">暂无台风数据</div>';
      return;
    }
    listEl.innerHTML = typhoonList.map((t, i) => {
      const isActive = t.status === 'start';
      return `<div class="ty-item" onclick="selectTyphoon(${i})" data-idx="${i}"
        style="padding:10px 12px; margin-bottom:6px; border-radius:8px; cursor:pointer; border:1px solid #eee;"
        onmouseover="this.style.background='#f0f7ff'" onmouseout="this.style.background=''">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:20px;">${isActive ? '🌀' : '⭕'}</span>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:13px;">${t.chinese_name || t.english_name} (${t.typhoon_no})</div>
            <div class="text-muted text-sm">${t.full_no} | ${t.english_name}</div>
          </div>
          <span class="tag ${isActive ? 'tag-red' : 'tag-gray'}" style="font-size:11px;">
            ${isActive ? '活跃' : '停编'}
          </span>
        </div>
      </div>`;
    }).join('');

    showToast(`获取到${typhoonList.length}个台风`);
  } catch (e) {
    handleError(e, '台风查询');
  }
}

async function selectTyphoon(idx) {
  const t = typhoonList[idx];
  currentTyphoon = t;
  document.querySelectorAll('.ty-item').forEach(el => el.style.borderColor = '#eee');
  const item = document.querySelector(`[data-ty-idx="${idx}"], [data-idx="${idx}"]`);
  if (item) item.style.borderColor = '#3b82f6';

  document.getElementById('ty-detail').style.display = '';
  document.getElementById('ty-detail-title').textContent = `🌀 ${t.chinese_name || t.english_name} (${t.typhoon_no})`;
  document.getElementById('ty-detail-content').innerHTML = '<div class="text-muted">正在获取路径详情...</div>';

  try {
    const detail = await API.get('/api/realtime/typhoons/' + t.typhoon_id);
    const trackPoints = detail.track_points || [];
    const forecastPoints = detail.forecast_points || [];

    let html = `
      <table class="data-table" style="width:100%; margin-bottom:16px;">
        <tr><td style="width:100px;" class="text-muted">中文名</td><td>${detail.chinese_name || t.chinese_name || '-'}</td>
            <td style="width:100px;" class="text-muted">英文名</td><td>${detail.english_name || t.english_name || '-'}</td></tr>
        <tr><td class="text-muted">编号</td><td>${detail.full_no || t.full_no}</td>
            <td class="text-muted">状态</td><td>${detail.status === 'start' ? '活跃中' : '已停编'}</td></tr>
        <tr><td class="text-muted">开始时间</td><td>${detail.start_time || '-'}</td>
            <td class="text-muted">停编时间</td><td>${detail.stop_time || '-'}</td></tr>
        <tr><td class="text-muted">历史路径点</td><td>${trackPoints.length}个</td>
            <td class="text-muted">预报路径点</td><td>${forecastPoints.length}个</td></tr>
      </table>
    `;

    // 显示最新位置
    if (trackPoints.length > 0) {
      const latest = trackPoints[trackPoints.length - 1];
      html += `<div class="card" style="padding:12px; background:#fff7ed; border-color:#fdba74; margin-bottom:12px;">
        <b>最新位置:</b> 北纬${latest.lat}° 东经${latest.lon}°<br>
        <b>时间:</b> ${latest.time} | <b>风速:</b> ${latest.wind_speed}m/s | <b>气压:</b> ${latest.pressure}hPa | <b>强度:</b> ${latest.level}
      </div>`;
    }

    // 路径表
    if (trackPoints.length > 0) {
      html += '<div style="font-weight:600; margin-bottom:8px;">📍 历史路径</div><div style="max-height:200px; overflow-y:auto;">';
      html += '<table class="data-table" style="width:100%; font-size:12px;"><thead><tr><th>时间</th><th>纬度</th><th>经度</th><th>风速</th><th>气压</th><th>强度</th></tr></thead><tbody>';
      // 显示最近的20个点(倒序)
      const recent = trackPoints.slice(-20).reverse();
      recent.forEach(p => {
        html += `<tr><td>${p.time}</td><td>${p.lat}</td><td>${p.lon}</td><td>${p.wind_speed}</td><td>${p.pressure}</td><td>${p.level}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }

    document.getElementById('ty-detail-content').innerHTML = html;

    // 在地图上绘制路径
    if (tyTrackLayer) tyMap.removeLayer(tyTrackLayer);
    tyTrackLayer = L.layerGroup();

    if (trackPoints.length > 0) {
      const latlngs = trackPoints.map(p => [p.lat, p.lon]);
      // 历史路径(红色实线)
      L.polyline(latlngs, {color: '#ef4444', weight: 3, opacity: 0.8}).addTo(tyTrackLayer);
      // 路径点标记
      trackPoints.forEach((p, i) => {
        if (i % Math.ceil(trackPoints.length / 30) === 0 || i === trackPoints.length - 1) {
          L.circleMarker([p.lat, p.lon], {
            radius: 4, fillColor: '#ef4444', color: '#fff', weight: 1, fillOpacity: 0.8
          }).bindPopup(`${p.time}<br>风速: ${p.wind_speed}m/s<br>气压: ${p.pressure}hPa<br>${p.level}`)
            .addTo(tyTrackLayer);
        }
      });
      // 最新位置大标记
      const latest = trackPoints[trackPoints.length - 1];
      L.circleMarker([latest.lat, latest.lon], {
        radius: 10, fillColor: '#dc2626', color: '#fff', weight: 2, fillOpacity: 1
      }).bindPopup(`<b>当前位置</b><br>${latest.time}<br>风速: ${latest.wind_speed}m/s`)
        .addTo(tyTrackLayer);
    }

    // 预报路径(蓝色虚线)
    if (forecastPoints.length > 0) {
      const fcLatLngs = forecastPoints.map(p => [p.lat, p.lon]);
      L.polyline(fcLatLngs, {color: '#3b82f6', weight: 2, opacity: 0.6, dashArray: '8,8'}).addTo(tyTrackLayer);
    }

    tyTrackLayer.addTo(tyMap);
    if (trackPoints.length > 0) {
      const latest = trackPoints[trackPoints.length - 1];
      tyMap.flyTo([latest.lat, latest.lon], 6, {duration: 1});
    }
    // 显示一键导入按钮
    document.getElementById('ty-import-btn').style.display = '';
  } catch (e) {
    document.getElementById('ty-detail-content').innerHTML = '<div class="text-muted">获取路径详情失败: ' + e.message + '</div>';
  }
}

// ===== 天气预警 =====
function alertColor(level) {
  if (level.includes('红')) return '#dc2626';
  if (level.includes('橙')) return '#ea580c';
  if (level.includes('黄')) return '#f59e0b';
  if (level.includes('蓝')) return '#3b82f6';
  return '#6b7280';
}

function alertIcon(type) {
  const icons = {
    '暴雨': '🌧️', '洪水': '🌊', '地质灾害': '⛰️', '山洪': '💧',
    '台风': '🌀', '大风': '💨', '雷电': '⚡', '高温': '🌡️', '其他': '⚠️'
  };
  return icons[type] || '⚠️';
}

async function loadAlerts() {
  const type = document.getElementById('alert-type').value;
  try {
    showToast('正在获取预警数据...');
    const url = '/api/realtime/alerts' + (type ? '?type=' + encodeURIComponent(type) : '');
    const data = await API.get(url);
    const alerts = data.alerts || [];
    document.getElementById('alert-source-info').textContent = data.source || '';
    document.getElementById('alert-count').textContent = `共${alerts.length}条`;

    initAlertMap();
    setTimeout(() => alertMap.invalidateSize(), 100);

    // 清除旧标记
    alertMarkers.forEach(m => alertMap.removeLayer(m));
    alertMarkers = [];

    // 渲染列表
    const listEl = document.getElementById('alert-list');
    if (alerts.length === 0) {
      listEl.innerHTML = '<div class="text-center text-muted" style="padding:40px;">暂无预警数据</div>';
      return;
    }
    listEl.innerHTML = alerts.map((a, i) => {
      const color = alertColor(a.level);
      return `<div class="alert-item" data-idx="${i}"
        style="padding:10px 12px; margin-bottom:6px; border-radius:8px; cursor:pointer; border-left:4px solid ${color}; background:#f9fafb;"
        onmouseover="this.style.background='#f0f7ff'" onmouseout="this.style.background='#f9fafb'">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:20px;">${alertIcon(a.alert_type)}</span>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:13px;">${a.title}</div>
            <div class="text-muted text-sm">${a.publisher || ''} ${a.publish_time || ''}</div>
            <div class="text-sm" style="margin-top:4px; color:#555; line-height:1.4;">${(a.detail || '').substring(0, 80)}...</div>
          </div>
          <span style="background:${color}; color:#fff; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600;">
            ${a.level || '未知'}
          </span>
          <button class="btn btn-success btn-sm" onclick="event.stopPropagation(); importAlert('${a.alert_id}')" style="margin-left:4px; font-size:11px; padding:4px 10px;">📝 添加至场景</button>
        </div>
      </div>`;
    }).join('');

    // 渲染地图标记
    alerts.forEach(a => {
      if (a.lat && a.lng) {
        const marker = L.circleMarker([a.lat, a.lng], {
          radius: 12,
          fillColor: alertColor(a.level),
          color: '#fff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.7
        }).addTo(alertMap);
        marker.bindPopup(`<b>${alertIcon(a.alert_type)} ${a.title}</b><br><b>等级:</b> ${a.level}<br><b>发布:</b> ${a.publisher}<br><b>时间:</b> ${a.publish_time}<br><b>详情:</b> ${a.detail}`);
        alertMarkers.push(marker);
      }
    });

    if (alertMarkers.length > 0) {
      const group = L.featureGroup(alertMarkers);
      alertMap.fitBounds(group.getBounds().pad(0.1));
    }

    window._alerts = alerts;
    showToast(`获取到${alerts.length}条预警信息`);
  } catch (e) {
    handleError(e, '预警查询');
  }
}

// ===== 台风导入为场景 =====
async function importTyphoon() {
  if (!currentTyphoon) return;
  if (!confirm(`确定将台风「${currentTyphoon.chinese_name || currentTyphoon.english_name}」一键添加为教学场景？\n\n系统将根据台风参数自动生成物流网络、车辆、仓库、货物等场景数据。`)) return;

  try {
    showToast('正在生成场景...');
    const result = await API.post('/api/realtime/import-typhoon', {
      typhoon_id: currentTyphoon.typhoon_id
    });
    showToast(`导入成功: ${result.scenario_name}`);
    document.getElementById('ty-detail-content').innerHTML += `
      <div class="card" style="margin-top:16px; padding:16px; background:#f0fdf4; border-color:#86efac;">
        <div style="font-weight:700; color:#15803d;">✅ 场景导入成功</div>
        <div style="margin-top:8px;">场景ID: <code>${result.scenario_id}</code></div>
        <div>场景名称: ${result.scenario_name}</div>
        <div style="margin-top:8px;">
          <a href="/decision?scenario=${result.scenario_id}" class="btn btn-success btn-sm">进入决策</a>
          <a href="/editor?scenario=${result.scenario_id}" class="btn btn-outline btn-sm">编辑场景</a>
        </div>
      </div>
    `;
    document.getElementById('ty-import-btn').style.display = 'none';
  } catch (e) {
    handleError(e, '导入台风');
  }
}

let currentTyphoon = null;

// ===== 天气预警导入为场景 =====
async function importAlert(alertId) {
  if (!confirm('确定将此预警一键添加为教学场景？\n\n系统将根据预警参数自动生成物流网络、车辆、仓库、货物等场景数据。')) return;

  try {
    showToast('正在生成场景...');
    const result = await API.post('/api/realtime/import-alert', {
      alert_id: alertId
    });
    showToast(`导入成功: ${result.scenario_name}`);
    // 弹窗显示结果
    const alerts = window._alerts || [];
    const alert = alerts.find(a => a.alert_id === alertId);
    if (alert) {
      // 在列表项后追加成功提示
      showToast(`✅ ${result.scenario_name} 导入成功！场景ID: ${result.scenario_id}`, false);
    }
  } catch (e) {
    handleError(e, '导入预警');
  }
}

// ===== 自动加载 =====
// 页面加载时自动查询地震
window.addEventListener('load', () => {
  loadEarthquakes();
});
</script>
